name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, tests, demo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: make demo
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: demo-outputs
          path: |
            docs/images/*.png
            reports/backtest_summary.json
            models/registry/

  statsmodels-parity:
    name: Holt-Winters parity with statsmodels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt "statsmodels>=0.14"
      - name: Same recursion with fixed parameters, similar fit after optimisation
        shell: bash
        # -rs lists skips; the grep fails the job if the parity tests were skipped instead of run
        run: |
          pytest tests/test_statsmodels_parity.py -v -s -rs | tee parity.log
          ! grep -q SKIPPED parity.log

  docker:
    name: Docker image + API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sales-forecast-api .
      - run: docker run -d -p 8000:8000 --name api sales-forecast-api
      - name: Call the API
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf "localhost:8000/series?store=S01"
          curl -sf "localhost:8000/forecast?store=S01&category=snacks&horizon=7"
          curl -sf "localhost:8000/forecast?store=S01&horizon=7"
          curl -sf localhost:8000/backtest/S01-snacks
          curl -sf -X POST localhost:8000/forecast -H 'content-type: application/json' \
            -d '{"requests":[{"store":"S02","category":"dairy","horizon":3},{"store":"S05","horizon":3}]}'
