[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-forecasting-service"
version = "1.0.0"
description = "Daily sales forecasting with rolling-origin backtesting, per-series model selection, calibrated intervals and a forecast API."
authors = [{ name = "Vishavjit Singh Saini" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
salesforecast = "salesforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
